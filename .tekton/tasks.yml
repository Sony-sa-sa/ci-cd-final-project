apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-content
      image: bitnami/git
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        rm -rf $(workspaces.source.path)/* $(workspaces.source.path)/.[!.]*
        echo "Workspace cleaned"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "-v"
  steps:
    - name: nose-test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install --no-cache-dir -r requirements.txt
        nosetests $(params.args)
